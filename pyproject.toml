[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E501 (line too long) disabled — long declarative sensor descriptions and
# reverse-engineered API constants read better unwrapped. Enforced elsewhere.
ignore = ["E501"]

[tool.coverage.run]
source = ["custom_components/tandem"]

[tool.coverage.report]
# Mechanical enforcement of the ≥80% new-code target (STANDARD-code-quality §1;
# docs/quality-gates.md). Platinum aims higher; raised as coverage lands.
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.13"
# Strict typing is the Platinum target (HA Quality Scale `strict-typing` rule).
# The whole package — including the large research modules (coordinator,
# tandem_api) — is checked under mypy --strict with no per-module exemptions.
strict = true
